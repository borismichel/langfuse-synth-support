# Base kit config. The portal writes this as `synth <verb> --config config/demo.yaml`
# and scales volume via `--set generation.target_traces=N` on top (no YAML templating).
target:
  # The Langfuse this config points at by default. `LANGFUSE_BASE_URL` overrides it, which is
  # how the portal retargets this one shipped config per deployment — so leaving loopback here
  # is fine and deliberate (portal #187).
  host: "http://localhost:3000"
  project_hint: "demo"
generation:
  # Deterministic RNG seed for the whole dataset. Vary it to mint a distinct trace/id set.
  # The same seed always builds the same Spool — but re-seeding a project that already holds
  # it tells the story twice: OTLP appends rather than upserting (portal #213).
  seed: 42
  # The single, cross-kit operator volume knob (Spec A §4). The kit deterministically
  # derives its internal generation params from it via the identity derivation hook.
  target_traces: 1000
