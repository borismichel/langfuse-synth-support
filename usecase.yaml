# usecase.yaml — schema version 1 (scaffolded by `synth-authoring new`).
# The ONLY integration surface between this kit and the Demo Depot portal.
schema_version: 1
slug: support-triage-deflection
name: "Support Triage Deflection Decay"
tagline: "A KB re-index quietly halves retrieval quality — deflection falls, cost per ticket rises, and nothing ever errors."
vertical: "Customer Support / Service Operations"
story: |
  A support-triage agent handles customer tickets end to end: classify the intent,
  search the knowledge base, draft a reply, hand off to a human only when it cannot
  stand behind the answer. Then the KB is re-indexed. Retrieval quality collapses
  from ~0.82 to ~0.54 top-chunk relevance, the agent starts retrying its searches,
  context grows, and escalations jump from ~5% to ~44% — with a zero error rate the
  whole way. This kit backfills 28 days of backdated traces across that boundary so
  an SA can walk the diagnosis in one sitting: session replay of a ticket that went
  wrong, the retriever span that explains it, and the cost and deflection curves that
  put a number on the damage.
langfuse_features:
  - tracing
  - sessions
  - cost-tracking
  - scores
  - user-feedback
target:
  project_hint: demo
  supports:
  - cloud_eu
  - cloud_us
  - self_hosted
base_config:
  default: config/demo.yaml
config_schema:
  type: object
  properties:
    generation.seed:
      type: integer
      default: 42
      minimum: 0
      title: Generation seed
      description: Deterministic RNG seed for the whole dataset. Vary it to mint a
        distinct trace/id set per deployment; the same seed re-seeds idempotently
        (upsert).
    generation.target_traces:
      type: integer
      minimum: 1
      maximum: 100000
      default: 1000
      title: Target traces
      description: Total number of traces to generate. The single, uniform volume
        knob for this demo; the kit deterministically derives its internal generation
        params from it.
  required: []
pipeline:
- id: seed
  run: synth seed --config {config}
  timeout_minutes: 90
- id: verify
  run: synth verify --config {config}
  fatal: true
artifacts:
- path: DEMO_SCRIPT.md
  render: markdown
  title: Presenter Runbook
assets:
  docs:
  - path: README.md
    title: Overview
llm:
  providers:
  - anthropic
  - openai
live_components:
- name: companion
  description: Live triage console — ask the support agent a real question, flip the
    knowledge-base index between kb-v1 and the botched kb-v2 re-index, and watch
    retrieval collapse and the agent hand off. Each run emits a real Langfuse trace
    into this project, in the same shape as the seeded pool.
  command: synth companion --config {config} --host 0.0.0.0 --port 8080
  port: 8080
  requires_secrets:
  - LANGFUSE_PUBLIC_KEY
  - LANGFUSE_SECRET_KEY
  - LLM_API_KEY
  routes:
  - path: /
    title: Live triage console
  health_path: /healthz
