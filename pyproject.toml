[project]
name = "support-triage-deflection"
version = "0.1.0"
description = "Demo Depot synth kit — a runnable-green walking skeleton scaffolded by `synth-authoring new`."
requires-python = ">=3.11"
dependencies = [
    # The shared synthesis library (public git dependency). Pinned to a TAG — never a
    # moving branch — so this kit's vendor-approved output can't be silently rewritten by a
    # later lib change. Bump deliberately (see the lib's RELEASING.md).
    "langfuse-synth-core[companion] @ git+https://github.com/borismichel/langfuse-synth-core@v1.4.0",
    "langfuse>=4.0,<5",
    "PyYAML>=6,<7",
    "requests>=2.31",
    # The companion calls `adapter.llm()`, and core's [companion] extra ships only the web
    # stack (fastapi/uvicorn/python-multipart) — no LLM SDK. The adapter picks the provider
    # at runtime from the environment and `usecase.yaml` declares both, so BOTH clients must
    # be importable or the live console dies with ModuleNotFoundError on its first triage.
    # (Same reason the lender kit declares them directly.) Seed generation stays model-free:
    # these are companion-runtime deps, and the egress gate still proves seed never calls out.
    "anthropic>=0.40.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    # The determinism golden gate + `synth-authoring validate/freeze` ride the [authoring]
    # extra. SAME ref as the runtime pin above — the gate and the core the kit runs against
    # must be the one, identical build. Bump both pins together, never let them drift.
    "langfuse-synth-core[authoring] @ git+https://github.com/borismichel/langfuse-synth-core@v1.4.0",
]

[project.scripts]
synth = "synth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
